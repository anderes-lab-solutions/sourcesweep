name: publish-pypi
# Publishes to PyPI when a GitHub release is published (or on demand), using PyPI trusted
# publishing: no API token is stored anywhere. One-time setup on pypi.org:
#   Account → Publishing → Add a pending publisher → PyPI project "sourcesweep",
#   owner "anderes-lab-solutions", repository "sourcesweep", workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
