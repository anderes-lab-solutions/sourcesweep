[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcesweep"
version = "1.0.0"
description = "SourceSweep: cited competitive landscape scans for biotech. US/EU trials, PubMed, preprints, SEC filings, trade press and news."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tegan Anderes" }]
requires-python = ">=3.10"
dependencies = []   # the scanner, screening and tracking use only the standard library
keywords = ["biotech", "competitive intelligence", "clinical trials", "pubmed", "landscape", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
sourcesweep = "sourcesweep.cli:main"

[project.urls]
Homepage = "https://github.com/anderes-lab-solutions/sourcesweep"
Demo = "https://anderes-lab-solutions.github.io/sourcesweep/"

[tool.setuptools]
packages = ["sourcesweep"]
